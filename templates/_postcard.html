<a class="pcard" href="{{ q.url }}">
  <span class="pcard__img">{% if q.image %}<img src="{{ q.image|img }}" alt="{{ q.title }}" loading="lazy" decoding="async">{% endif %}</span>
  <span class="pcard__body">
    {% if q.cats %}<span class="chip">{{ q.cats[0].name }}</span>{% endif %}
    <strong>{{ q.title }}</strong>
    <span class="pcard__ex">{{ q.excerpt|truncate(150) }}</span>
    {% if q.date %}<time datetime="{{ q.published }}">{{ q.date|date }}</time>{% endif %}
  </span>
</a>
