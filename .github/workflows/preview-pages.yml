# Builds the website on every push to main and publishes a PREVIEW to GitHub Pages:
#   https://<owner>.github.io/<repo>/
# The preview is marked noindex so search engines never treat it as a copy of ciainsures.com.
# Forms and the feedback page need the real server, so they don't submit on the preview.
name: Preview website on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 beautifulsoup4 lxml pillow
      - run: python build.py --out _site --base-path "/${{ github.event.repository.name }}" --noindex
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
