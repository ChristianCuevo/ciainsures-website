# nginx site for ciainsures.com — installed to /etc/nginx/sites-available/ciainsures by setup_server.sh
# Legacy URL redirects come from the repo (deploy/redirects.map) and are reloaded on every deploy.

map $uri $cia_redirect {
    default "";
    include /srv/ciainsures/src/deploy/redirects.map;
}

# Only the real domain may be indexed; the bare IP / other hostnames get noindex so Google
# never treats them as duplicate copies of the site.
map $host $cia_robots {
    default             "noindex, nofollow";
    ciainsures.com      "";
    www.ciainsures.com  "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ciainsures.com www.ciainsures.com _;

    root /srv/ciainsures/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;
    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/rss+xml text/plain;

    include snippets/cia-headers.conf;

    if ($cia_redirect) { return 301 $cia_redirect; }

    location = /feed/            { default_type application/rss+xml; try_files /feed.xml =404; }
    location ~ ^/(category/[^/]+/)?feed/?$ { return 301 /feed/; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json) { return 404; }

    location /assets/ {
        include snippets/cia-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /wp-content/ {
        include snippets/cia-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }
    location = /llms.txt { default_type text/plain; }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        limit_except GET POST { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
        include snippets/cia-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }
}

# reviews.ciainsures.com: only the private client-feedback flow (links in the HubSpot email).
# Never indexed (X-Robots-Tag noindex via $cia_robots default); everything else goes to the main site.
server {
    listen 80;
    listen [::]:80;
    server_name reviews.ciainsures.com;
    root /srv/ciainsures/current;
    charset utf-8;
    absolute_redirect off;
    server_tokens off;
    include snippets/cia-headers.conf;

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location /api/admin { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        limit_except GET POST { deny all; }
    }
    location /feedback/   { try_files $uri $uri/ =404; }
    location /assets/     { }
    location /wp-content/ { }
    location / { return 302 https://ciainsures.com$request_uri; }
}
